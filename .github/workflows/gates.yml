name: gates
on: workflow_call
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
